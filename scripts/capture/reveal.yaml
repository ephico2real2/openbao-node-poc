# The dashboard while the app runs with LOG_REVEAL_SECRETS=true (CI, compose
# sdk job only): the warning is impossible to miss, the posture check fails,
# and the dashboard's own log panel still shows no value (revealed lines go to
# stdout only, never to /api/logs). The credential scan proves the stdout part.
viewport: {width: 1280, height: 900}

pages:
  - name: 07-reveal-banner
    url: ${BASE}/
    before: 4000
    expect:
      text: [Secret values are being written to the log, VALUES REVEALED]

  - name: 08-reveal-posture
    url: ${BASE}/
    before: 6000
    element: "#checks-card"
    expect:
      text: [Secret values kept out of logs, LOG_REVEAL_SECRETS=true]

  - name: 09-reveal-log-panel
    url: ${BASE}/
    before: 4000
    element: "#logs-card"
    actions:
      - clickSelector: "#log-cred-only"
      - wait: 2000
      - scrollToBottom: "#log"
      - wait: 500
    expect:
      text: [secret values will be written to this log]
      absent: [values revealed]
