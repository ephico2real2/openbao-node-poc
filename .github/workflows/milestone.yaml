# Tag a milestone of the Secure Notes story and publish its release notes.
# Manual only: Actions → milestone → Run workflow.
#
# Only for a commit whose .github/workflows files match the default branch's
# (in practice: main's tip). GitHub refuses a ref the workflow token creates on
# any other commit, because that token can never have the `workflows`
# permission. Older commits are tagged from a person's machine with
# scripts/cut-tags.sh.
name: milestone

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name (e.g. v1-secrets-manager)
        required: true
      ref:
        description: Commit SHA (or branch) to tag
        required: true
      title:
        description: Release title
        required: true
      notes_file:
        description: Release notes, a Markdown file in the repo (docs/releases/<tag>.md)
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
          TITLE: ${{ inputs.title }}
        # Each failure is also an ::error:: annotation, readable without the log.
        # If git refuses the push, the tag is made through the REST API instead
        # (an annotated tag object, then its ref).
        run: |
          set -euo pipefail
          err() { echo "::error title=milestone::$*"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+-[a-z0-9-]+$ ]] || err "tag must look like v2-alerts, got '$TAG'"
          sha=$(git rev-parse --verify "$REF^{commit}" 2>/dev/null) || err "no commit '$REF' in this repository"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then err "tag $TAG exists already"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$sha" -m "$TITLE"
          if out=$(git push origin "refs/tags/$TAG" 2>&1); then
            echo "pushed $TAG -> $sha"
          else
            echo "::warning title=milestone::git push refused: $(tr '\n' ' ' <<< "$out" | cut -c1-600)"
            obj=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$TITLE" -f object="$sha" -f type=commit --jq .sha 2>&1) \
              || err "the API refused the tag object too: $(tr '\n' ' ' <<< "$obj" | cut -c1-600)"
            out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" 2>&1) \
              || err "the API refused the tag ref: $(tr '\n' ' ' <<< "$out" | cut -c1-600)"
            echo "created $TAG -> $sha through the API"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes_file }}
        run: |
          out=$(gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" --verify-tag 2>&1) \
            || { echo "::error title=milestone::release not created: $(tr '\n' ' ' <<< "$out" | cut -c1-600)"; exit 1; }
          echo "$out"
