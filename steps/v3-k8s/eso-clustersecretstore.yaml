# Applied by scripts/eso-k8s-up.sh (cluster-scoped, so not part of the app overlay).
# How External Secrets Operator reaches OpenBao: its Vault provider (stable),
# KV v2 at "secret", Kubernetes auth as service account external-secrets with a
# token it requests for audience "openbao". OpenBao's role "external-secrets"
# may read only the app's two KV secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200 # lab: plain HTTP (TLS: set caProvider)
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences: ["openbao"]
