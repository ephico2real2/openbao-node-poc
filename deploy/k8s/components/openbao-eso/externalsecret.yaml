# The Secret the app mounts: one key per credential, each the whole KV secret
# as JSON (no "property": every field). Refreshed every 15 s (lab: so CI sees a
# rotation quickly); the kubelet then updates the mounted files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secure-notes-credentials
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: secure-notes-credentials
    creationPolicy: Owner
  data:
    - secretKey: db
      remoteRef:
        key: rds/dev/notes-db/app
    - secretKey: redis
      remoteRef:
        key: elasticache/dev/notes-cache/app
