# kind (or any local Kubernetes): the app plus in-cluster Postgres, Redis and the
# Secrets Manager mock. Images are the locally built :dev tags,
# loaded into kind by scripts/images-build.sh.
#
#   scripts/kind-up.sh && scripts/images-build.sh && scripts/k8s-deploy.sh deploy/k8s/overlays/kind
#   open http://localhost:3000
#
# The app's Service is a NodePort on a fixed port that deploy/kind/cluster.yaml
# maps to 127.0.0.1 on the host, so no port-forward is needed. On another
# cluster, use `kubectl port-forward` instead (the ports stay the same).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secure-notes

resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/local-backing-services

patches:
  - target: { kind: Service, name: secure-notes }
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
