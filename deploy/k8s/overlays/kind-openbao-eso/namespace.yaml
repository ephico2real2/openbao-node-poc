# Pod Security "restricted" enforced: the API server rejects any pod in this
# namespace that runs as root, keeps capabilities, allows privilege
# escalation or skips the seccomp profile.
apiVersion: v1
kind: Namespace
metadata:
  name: secure-notes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
