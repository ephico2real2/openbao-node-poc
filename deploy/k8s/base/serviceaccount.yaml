# The pod's identity. On EKS or ROSA the aws overlay annotates it with an IAM
# role (IRSA), which is how the pod gets short-lived AWS credentials: the
# Kubernetes equivalent of the EC2 instance role. No keys anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-notes
automountServiceAccountToken: false # the app never talks to the Kubernetes API
